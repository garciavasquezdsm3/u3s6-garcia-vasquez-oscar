{% extends 'core/base.html' %}

{% block titulo %}Registro de Usuario{% endblock %}

{% block contenido %}
  <div class="max-w-md mx-auto bg-slate-50 p-6 rounded-xl border border-slate-200">
    <h1 class="text-2xl font-bold mb-6">Crear una cuenta</h1>
    <form method="post" class="space-y-4">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg font-semibold hover:bg-blue-700">Registrarse</button>
    </form>
    <p class="mt-4 text-sm text-slate-600 text-center">¿Ya tienes cuenta? <a href="{% url 'login' %}" class="text-blue-600 underline">Inicia sesión</a></p>
  </div>
{% endblock %}
